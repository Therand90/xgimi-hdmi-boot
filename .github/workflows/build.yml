name: Build verification

# CI builds are for verification only. The script creates a temporary
# signing key on the runner, so these APKs must NOT be published as releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip zip openssl
      - name: Build and verify APK (temporary CI signing)
        run: |
          chmod +x ./INSTALL.sh
          ./INSTALL.sh --build-only
          test -s XGIMI-HDMI-Boot.apk
      - name: Validate release script syntax
        run: |
          bash -n PUBLISH_v1.2.sh
          bash -n PUBLISH_v1.3.sh
      - name: Check that no signing key is tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.signing/|[^/]+\.(jks|keystore|p12|pem)$)'; then
            echo "Unexpected signing secret tracked by Git" >&2
            exit 1
          fi
